# On every push to main: run the tests, then deploy the bundle (jobs, notebooks, src/) to Databricks.
# If a test fails, nothing is deployed, so the nightly pipeline keeps running the last good code.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4   # local Spark needs Java 17 or 21
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync --locked
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev
      - run: databricks bundle deploy -t dev
