# Job: load every new Google Sheet snapshot from the Volume into the bronze table.
# No cluster is defined, so the notebook task runs on serverless compute (the only option on Free Edition).
resources:
  jobs:
    bronze_load:
      name: bronze_load
      max_concurrent_runs: 1
      tasks:
        - task_key: load_snapshots
          notebook_task:
            notebook_path: ../notebooks/bronze/load_snapshots.py
            base_parameters:
              catalog: ${var.catalog}
